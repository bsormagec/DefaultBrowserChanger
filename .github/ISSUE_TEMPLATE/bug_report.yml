name: Bug Report
description: Create a report to help us fix a problem or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click on Firefox in the menu bar, the default browser does not switch...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Click on the Globe icon in the menu bar
        2. Click on 'Safari'
        3. See error or notice browser did not change
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: e.g. macOS 15.0 Sequoia (Build 24A335)
    validations:
      required: true
  - type: textarea
    id: browsers
    attributes:
      label: Installed Browsers
      placeholder: Google Chrome, Safari, Arc, Firefox, etc.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any console logs or screenshots (attach here).
