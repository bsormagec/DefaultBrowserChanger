name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Release Archive
        run: |
          cd build
          zip -r -y DefaultBrowserChanger.zip DefaultBrowserChanger.app
          shasum -a 256 DefaultBrowserChanger.zip > DefaultBrowserChanger.zip.sha256
          cat DefaultBrowserChanger.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: DefaultBrowserChanger ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/DefaultBrowserChanger.zip
            build/DefaultBrowserChanger.zip.sha256
